name: Edition rebuild notice

# When a UserTasks release is published, tell the edition builds (separate,
# private repositories that compile the paid extensions into the Enterprise
# image) so they build for the new release within minutes. Optional: it does
# nothing unless the EDITION_DISPATCH_REPO variable (owner/name, or several
# separated by commas or spaces, e.g. homepresso/usertasks-enterprise) and the
# EDITION_DISPATCH_TOKEN secret (a fine-grained token with Contents: read and
# write on those repositories, which repository_dispatch needs) are set. The
# edition builds also check for new releases every six hours on their own.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release version (x.y.z) to announce
        type: string
        required: true

permissions: {}

jobs:
  dispatch:
    if: ${{ !github.event.repository.fork && vars.EDITION_DISPATCH_REPO != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: repository_dispatch core-release
        env:
          GH_TOKEN: ${{ secrets.EDITION_DISPATCH_TOKEN }}
          REPO: ${{ vars.EDITION_DISPATCH_REPO }}
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::notice::EDITION_DISPATCH_TOKEN is not set: skipped"; exit 0; fi
          v="${VERSION#v}"
          printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "::error::not a version: $VERSION"; exit 1; }
          for r in $(printf '%s' "$REPO" | tr ',' ' '); do
            printf '{"event_type":"core-release","client_payload":{"version":"%s"}}' "$v" | gh api "repos/$r/dispatches" --method POST --input -
            echo "Announced $v to $r."
          done
