name: Edition rebuild notice

# When a UserTasks release is published, tell the edition build (a separate,
# private repository that compiles paid extensions into their own images) so
# it builds for the new release within minutes. Optional: it does nothing
# unless the EDITION_DISPATCH_REPO variable (owner/name) and the
# EDITION_DISPATCH_TOKEN secret (a fine-grained token with Contents: read and
# write on that one repository, which repository_dispatch needs) are set. The
# edition build also checks for new releases every six hours on its own.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release version (x.y.z) to announce
        type: string
        required: true

permissions: {}

jobs:
  dispatch:
    if: ${{ !github.event.repository.fork && vars.EDITION_DISPATCH_REPO != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: repository_dispatch core-release
        env:
          GH_TOKEN: ${{ secrets.EDITION_DISPATCH_TOKEN }}
          REPO: ${{ vars.EDITION_DISPATCH_REPO }}
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::notice::EDITION_DISPATCH_TOKEN is not set: skipped"; exit 0; fi
          v="${VERSION#v}"
          printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "::error::not a version: $VERSION"; exit 1; }
          printf '{"event_type":"core-release","client_payload":{"version":"%s"}}' "$v" | gh api "repos/$REPO/dispatches" --method POST --input -
          echo "Announced $v to the edition build."
