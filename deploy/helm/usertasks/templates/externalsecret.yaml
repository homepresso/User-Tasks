{{- if .Values.secrets.externalSecret.enabled }}
{{- $es := .Values.secrets.externalSecret }}
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "usertasks.secretName" . }}
  labels:
    {{- include "usertasks.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ required "secrets.externalSecret.secretStoreRef.name is required" $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ include "usertasks.secretName" . }}
    creationPolicy: Owner
  {{- with $es.data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $es.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
