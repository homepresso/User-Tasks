{{- if and .Values.secrets.csi.enabled .Values.secrets.csi.spec (not .Values.secrets.csi.secretProviderClass) }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "usertasks.fullname" . }}
  labels:
    {{- include "usertasks.labels" . | nindent 4 }}
spec:
  {{- toYaml .Values.secrets.csi.spec | nindent 2 }}
{{- end }}
