{{- if .Values.serviceAccount.create }}
{{- $wi := .Values.serviceAccount.workloadIdentity }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "usertasks.serviceAccountName" . }}
  labels:
    {{- include "usertasks.labels" . | nindent 4 }}
  {{- if or .Values.serviceAccount.annotations $wi.awsRoleArn $wi.azureClientId $wi.gcpServiceAccount }}
  annotations:
    {{- with $wi.awsRoleArn }}
    eks.amazonaws.com/role-arn: {{ . | quote }}
    {{- end }}
    {{- with $wi.azureClientId }}
    azure.workload.identity/client-id: {{ . | quote }}
    {{- end }}
    {{- with $wi.azureTenantId }}
    azure.workload.identity/tenant-id: {{ . | quote }}
    {{- end }}
    {{- with $wi.gcpServiceAccount }}
    iam.gke.io/gcp-service-account: {{ . | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- if and .Values.serviceAccount.create (eq (include "usertasks.migrateMode" .) "hook") }}
{{- $wi := .Values.serviceAccount.workloadIdentity }}
---
# For the pre-install / pre-upgrade migrate hook (it runs before the
# ServiceAccount above exists). Same workload identity annotations: with
# IAM database auth, federate / bind this service account too.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "usertasks.migrateServiceAccountName" . }}
  labels:
    {{- include "usertasks.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- if or .Values.serviceAccount.annotations $wi.awsRoleArn $wi.azureClientId $wi.gcpServiceAccount }}
    {{- with $wi.awsRoleArn }}
    eks.amazonaws.com/role-arn: {{ . | quote }}
    {{- end }}
    {{- with $wi.azureClientId }}
    azure.workload.identity/client-id: {{ . | quote }}
    {{- end }}
    {{- with $wi.azureTenantId }}
    azure.workload.identity/tenant-id: {{ . | quote }}
    {{- end }}
    {{- with $wi.gcpServiceAccount }}
    iam.gke.io/gcp-service-account: {{ . | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
