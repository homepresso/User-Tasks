apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "usertasks.fullname" . }}-config
  labels:
    {{- include "usertasks.labels" . | nindent 4 }}
data:
  {{- include "usertasks.configEnv" . | nindent 2 }}
{{- if eq (include "usertasks.migrateMode" .) "hook" }}
---
# The same configuration for the pre-install / pre-upgrade migrate hook,
# which runs before the release's own resources exist.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "usertasks.fullname" . }}-migrate-config
  labels:
    {{- include "usertasks.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  {{- include "usertasks.configEnv" . | nindent 2 }}
{{- end }}
