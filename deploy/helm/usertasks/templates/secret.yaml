{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) (not .Values.secrets.externalSecret.enabled) }}
{{- $name := include "usertasks.secretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "usertasks.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- $values := .Values.secrets.values | default dict }}
  ENCRYPTION_KEY: {{ (index $values "ENCRYPTION_KEY") | default (include "usertasks.persistentRandom" (dict "root" . "secret" $name "key" "ENCRYPTION_KEY")) | quote }}
  CRON_SECRET: {{ (index $values "CRON_SECRET") | default (include "usertasks.persistentRandom" (dict "root" . "secret" $name "key" "CRON_SECRET")) | quote }}
  {{- range $key, $value := $values }}
  {{- if not (has $key (list "ENCRYPTION_KEY" "CRON_SECRET")) }}
  {{ $key }}: {{ toString $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
