{{- if .Values.postgresql.enabled }}
{{- $pg := .Values.postgresql }}
{{ include "usertasks.eval.service" (dict "root" . "name" "postgresql" "ports" (list (dict "name" "postgres" "port" 5432))) }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "usertasks.fullname" . }}-postgresql
  labels:
    {{- include "usertasks.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ include "usertasks.fullname" . }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      {{- include "usertasks.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        {{- include "usertasks.eval.labels" (dict "root" . "name" "postgresql") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "usertasks.eval.podSecurity" (dict "uid" 70) | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgresql
          image: {{ include "usertasks.imageRef" (dict "root" . "image" $pg.image) }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "usertasks.eval.containerSecurity" . | nindent 12 }}
          env:
            - { name: POSTGRES_USER, value: {{ $pg.username | quote }} }
            - { name: POSTGRES_DB, value: {{ $pg.database | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "usertasks.evalSecretName" . }}
                  key: POSTGRES_PASSWORD
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        {{- if not $pg.persistence.enabled }}
        - { name: data, emptyDir: {} }
        {{- end }}
  {{- if $pg.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $pg.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.persistence.size }}
  {{- end }}
{{- end }}
