{{- if .Values.valkey.enabled }}
{{- $vk := .Values.valkey }}
{{ include "usertasks.eval.service" (dict "root" . "name" "valkey" "ports" (list (dict "name" "redis" "port" 6379))) }}
---
# Shared rate-limit windows and cache invalidations: nothing in it is the
# source of truth, so no persistence.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "usertasks.fullname" . }}-valkey
  labels:
    {{- include "usertasks.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "usertasks.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: valkey
  template:
    metadata:
      labels:
        {{- include "usertasks.eval.labels" (dict "root" . "name" "valkey") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "usertasks.eval.podSecurity" (dict "uid" 999) | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: valkey
          image: {{ include "usertasks.imageRef" (dict "root" . "image" $vk.image) }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "exec valkey-server --save '' --appendonly no --maxmemory 128mb --maxmemory-policy volatile-lru --requirepass \"$VALKEY_PASSWORD\""]
          securityContext:
            {{- include "usertasks.eval.containerSecurity" . | nindent 12 }}
          env:
            - name: VALKEY_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "usertasks.evalSecretName" . }}, key: CACHE_REDIS_PASSWORD } }
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec:
              command: ["sh", "-c", "valkey-cli -a \"$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            periodSeconds: 5
          resources:
            {{- toYaml $vk.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - { name: data, emptyDir: {} }
{{- end }}
