{{- if .Values.minio.enabled }}
{{- $m := .Values.minio }}
{{ include "usertasks.eval.service" (dict "root" . "name" "minio" "ports" (list (dict "name" "s3" "port" 9000))) }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "usertasks.fullname" . }}-minio
  labels:
    {{- include "usertasks.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  serviceName: {{ include "usertasks.fullname" . }}-minio
  replicas: 1
  selector:
    matchLabels:
      {{- include "usertasks.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        {{- include "usertasks.eval.labels" (dict "root" . "name" "minio") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "usertasks.eval.podSecurity" (dict "uid" 1000) | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: minio
          image: {{ include "usertasks.imageRef" (dict "root" . "image" $m.image) }}
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--certs-dir", "/tmp/certs"]
          securityContext:
            {{- include "usertasks.eval.containerSecurity" . | nindent 12 }}
          env:
            - { name: HOME, value: /tmp }
            - { name: MINIO_BROWSER, value: "off" }
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: {{ include "usertasks.evalSecretName" . }}, key: MINIO_ROOT_USER } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "usertasks.evalSecretName" . }}, key: MINIO_ROOT_PASSWORD } }
          ports:
            - { name: s3, containerPort: 9000 }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: s3 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /minio/health/live, port: s3 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml $m.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
        {{- if not $m.persistence.enabled }}
        - { name: data, emptyDir: {} }
        {{- end }}
  {{- if $m.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $m.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $m.persistence.size }}
  {{- end }}
{{- end }}
