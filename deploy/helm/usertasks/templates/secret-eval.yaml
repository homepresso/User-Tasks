{{- if include "usertasks.bundled" . }}
{{- $name := include "usertasks.evalSecretName" . }}
{{- $fullname := include "usertasks.fullname" . }}
{{- $db := .Values.providers.db.options | default dict }}
{{- $storage := .Values.providers.storage.options | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "usertasks.labels" . | nindent 4 }}
    app.kubernetes.io/component: bundled-dependencies
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  {{- $pw := include "usertasks.persistentRandom" (dict "root" . "secret" $name "key" "POSTGRES_PASSWORD") }}
  {{- $url := printf "postgresql://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.username $pw $fullname .Values.postgresql.database }}
  POSTGRES_PASSWORD: {{ $pw | quote }}
  {{- if not $db.url }}
  DATABASE_URL: {{ $url | quote }}
  {{- end }}
  {{- if not $db.migration_url }}
  MIGRATION_DATABASE_URL: {{ $url | quote }}
  {{- end }}
  {{- if not (.Values.providers.realtime.options | default dict).database_url }}
  REALTIME_DATABASE_URL: {{ $url | quote }}
  {{- end }}
  {{- if not (.Values.providers.scheduler.options | default dict).database_url }}
  SCHEDULER_DATABASE_URL: {{ $url | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.minio.enabled }}
  {{- $minio := include "usertasks.persistentRandom" (dict "root" . "secret" $name "key" "MINIO_ROOT_PASSWORD") }}
  MINIO_ROOT_USER: usertasks
  MINIO_ROOT_PASSWORD: {{ $minio | quote }}
  {{- if not $storage.access_key_id }}
  S3_ACCESS_KEY_ID: usertasks
  S3_SECRET_ACCESS_KEY: {{ $minio | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.valkey.enabled }}
  CACHE_REDIS_PASSWORD: {{ include "usertasks.persistentRandom" (dict "root" . "secret" $name "key" "CACHE_REDIS_PASSWORD") | quote }}
  {{- end }}
{{- end }}
