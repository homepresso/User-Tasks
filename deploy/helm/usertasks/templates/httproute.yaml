{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "usertasks.fullname" . }}
  labels:
    {{- include "usertasks.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- required "gateway.parentRefs is required with gateway.enabled (the Gateway to attach to)" .Values.gateway.parentRefs | toYaml | nindent 4 }}
  hostnames:
    {{- if .Values.gateway.hostnames }}
    {{- toYaml .Values.gateway.hostnames | nindent 4 }}
    {{- else }}
    - {{ (urlParse .Values.appUrl).hostname | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "usertasks.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
