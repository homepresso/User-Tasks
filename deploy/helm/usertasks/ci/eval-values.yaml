# chart-testing (`ct install`): examples/eval.yaml plus the egress allowlist.
appUrl: http://localhost:3000
providers:
  db: { provider: postgres }
  auth: { provider: builtin }
  storage: { provider: s3 }
  realtime: { provider: sse }
  scheduler: { provider: worker }
  email: { provider: smtp }
  cache: { provider: redis }
app:
  replicas: 1
postgresql: { enabled: true, persistence: { enabled: false } }
minio: { enabled: true, persistence: { enabled: false } }
valkey: { enabled: true }
mailpit: { enabled: true }
networkPolicy:
  enabled: true
  egress:
    mode: allowlist
