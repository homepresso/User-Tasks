# Azure Kubernetes Service: Database for PostgreSQL Flexible Server with Entra
# token auth, Blob Storage, Azure Cache for Redis (Entra auth), Communication
# Services Email, Key Vault (secrets + KMS key), all through AKS workload
# identity. Secrets via the Secrets Store CSI driver (Key Vault provider).
# The managed identity (federated with this service account) needs: the
# PostgreSQL Entra admin / role, Storage Blob Data Contributor, a Redis data
# access policy, Key Vault Secrets User + Crypto Service Encryption User, and
# the ACS "Contributor" role (or a custom role with email send).

appUrl: https://tasks.example.com

serviceAccount:
  workloadIdentity:
    azureClientId: 00000000-0000-0000-0000-000000000000
    azureTenantId: 11111111-1111-1111-1111-111111111111

secrets:
  create: false
  existingSecret: usertasks-env   # synced by the SecretProviderClass below
  csi:
    enabled: true
    spec:
      provider: azure
      parameters:
        usePodIdentity: "false"
        clientID: 00000000-0000-0000-0000-000000000000
        keyvaultName: usertasks-kv
        tenantId: 11111111-1111-1111-1111-111111111111
        objects: |
          array:
            - |
              objectName: encryption-key
              objectType: secret
            - |
              objectName: cron-secret
              objectType: secret
      secretObjects:
        - secretName: usertasks-env
          type: Opaque
          data:
            - { objectName: encryption-key, key: ENCRYPTION_KEY }
            - { objectName: cron-secret, key: CRON_SECRET }

migrate:
  # The Secret is synced by the CSI driver once a pod mounts it: run
  # migrations as a Job (app pods wait for it) rather than a pre-install hook.
  mode: job

providers:
  db:
    provider: postgres
    options:
      auth: azure
      url: postgresql://usertasks-identity@usertasks-pg.postgres.database.azure.com:5432/usertasks?sslmode=require
      migration_url: postgresql://usertasks-identity@usertasks-pg.postgres.database.azure.com:5432/usertasks?sslmode=require
  auth:
    provider: builtin
    options:
      sso_providers:
        - id: entra
          type: oidc
          preset: entra
          tenantId: 11111111-1111-1111-1111-111111111111
          clientId: 22222222-2222-2222-2222-222222222222
          clientSecret: secret://entra-client-secret
  storage:
    provider: azure_blob
    options:
      azure_account_name: usertasksfiles
      bucket_prefix: usertasks-
  realtime:
    provider: sse
    options:
      database_url: postgresql://usertasks-identity@usertasks-pg.postgres.database.azure.com:5432/usertasks?sslmode=require
  scheduler:
    provider: worker
    options:
      database_url: postgresql://usertasks-identity@usertasks-pg.postgres.database.azure.com:5432/usertasks?sslmode=require
  email:
    provider: azure_communication
    options:
      acs_endpoint: https://usertasks-acs.europe.communication.azure.com
      from: DoNotReply@example.com
  secrets:
    provider: azure_key_vault
    options:
      azure_key_vault_url: https://usertasks-kv.vault.azure.net
  kms:
    provider: azure_key_vault
    options:
      azure_key_id: https://usertasks-kv.vault.azure.net/keys/usertasks
  cache:
    provider: redis
    options:
      redis_url: rediss://usertasks.redis.cache.windows.net:6380
      redis_auth: entra
      # The managed identity's object (principal) id: the Redis data access user.
      redis_username: 33333333-3333-3333-3333-333333333333

app:
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 10 }

ingress:
  enabled: true
  className: webapprouting.kubernetes.azure.com
  certManager:
    clusterIssuer: letsencrypt
  tls:
    enabled: true
