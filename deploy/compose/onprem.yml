# Reference on-premises profile (docs/deployment-profiles.md): the standalone
# stack on a Docker network with no route to the internet, so a test run proves
# nothing calls out (no SaaS, no CDN, no telemetry). Optional Keycloak (OIDC)
# with --profile keycloak. Envelope encryption with OpenBao Transit
# (deploy/compose/kms.yml, kms-vault), which `npm run stack` adds. Used by `npm run stack -- up|smoke --profile onprem`;
# nothing is published on the host — reach it from a container on the network.
#
#   docker compose -f docker-compose.yml -f deploy/compose/onprem.yml --profile standalone up -d

networks:
  default:
    internal: true

services:
  app:
    ports: !reset []
    depends_on:
      keycloak:
        condition: service_healthy
        required: false
  minio:
    ports: !reset []
  mailpit:
    ports: !reset []

  keycloak:
    profiles: [keycloak]
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8080", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-keycloak-admin
    volumes:
      - ./deploy/compose/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30
